services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.multistage
    image: spam-api:v1
    container_name: spam-api
    ports:
      - "8000:8000"
    environment:
      REDIS_HOST: cache
      REDIS_PORT: "6379"
      CACHE_TTL: "300"
    depends_on:
      cache:
        condition: service_healthy
    restart: unless-stopped

  cache:
    image: redis:7-alpine
    container_name: spam-cache
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
    restart: unless-stopped
